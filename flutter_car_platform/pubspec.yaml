name: flutter_car_platform
description: "منصة معارض السيارات - تطبيق متكامل لإدارة وشراء وبيع السيارات والمحادثة الفورية عبر Supabase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  get: ^4.6.6

  # Backend & Database (Supabase)
  supabase_flutter: ^2.17.2

  # Image Picker & Compression
  image_picker: ^0.8.13+22
  flutter_image_compress: ^2.3.0

  # Push Notifications & Secure Storage
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.0.0

  # UI Enhancements & Network Images
  cached_network_image: ^4.0.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.4.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
