name: flutter_car_platform
description: "منصة معارض السيارات - تطبيق متكامل لإدارة وشراء وبيع السيارات والمحادثة الفورية عبر Supabase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  get: ^4.6.6

  # Backend & Database (Supabase)
  supabase_flutter: ^2.8.0

  # Image Picker & Compression
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Push Notifications & Secure Storage
  flutter_local_notifications: ^17.2.2
  flutter_secure_storage: ^9.2.2

  # UI Enhancements & Network Images
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
